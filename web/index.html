<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MoonOpenRaster — 图层工作台</title><link rel="stylesheet" href="style.css"><body>
<header><div class="brand">MoonOpenRaster <span>图层工作台</span></div><nav><button id="sample">重置示例</button><button id="open">打开 ORA</button><button id="png">导出 PNG 图片</button><button id="save" class="primary">保存 ORA 文档</button></nav><input type="file" id="file" accept=".ora" hidden></header>
<main><aside><div class="section">图层 <span id="count"></span></div><div id="tree"></div><details class="usage-note"><summary>这个工作台能做什么？</summary><p>打开保留了图层的 ORA 作品，调整其中某一层，再导出图片或保存为可继续编辑的文档。</p><p>PNG 把图层合成一张图片；ORA 保留独立图层，可以交给 Krita 继续编辑。</p></details><div class="aside-note">图像由多个图层叠成。选择图层，在右侧调整后点击“应用修改”，即可查看效果。</div></aside><section class="stage"><div class="toolbar"><strong id="title"></strong><label><input id="original" type="checkbox"> 查看原始画面</label></div><div class="canvas-wrap"><img id="canvas" alt="当前图层合成画面"></div><footer><span id="dimensions"></span><span>文件仅在本机处理</span></footer></section><aside class="properties"><div class="section">图层属性</div><form id="properties"><label>名称<input id="name" required></label><div class="pair"><label>水平位置（X）<input id="x" type="number" min="-1000000" max="1000000" required></label><label>垂直位置（Y）<input id="y" type="number" min="-1000000" max="1000000" required></label></div><label>不透明度<input id="opacity" type="range" min="0" max="1" step="0.01"><output id="opacityValue"></output></label><label>混合方式<select id="op"></select></label><label class="check"><input id="visible" type="checkbox">显示此图层</label><button class="primary" type="submit">应用修改</button></form><p id="status" role="status" aria-live="polite"></p></aside></main><script type="module" src="app.js"></script></body></html>

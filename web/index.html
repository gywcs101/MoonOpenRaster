<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MoonOpenRaster — Layer workspace</title><link rel="stylesheet" href="style.css"><body>
<header><div class="brand">MoonOpenRaster <span>Layer workspace</span></div><nav><button id="sample">Reset sample</button><button id="open">Open .ora</button><button id="png">Export PNG</button><button id="save" class="primary">Save .ora</button></nav><input type="file" id="file" accept=".ora" hidden></header>
<main><aside><div class="section">LAYERS <span id="count"></span></div><div id="tree"></div><div class="aside-note">Top layers appear in front. Select a layer to adjust its properties.</div></aside><section class="stage"><div class="toolbar"><strong id="title"></strong><label><input id="original" type="checkbox"> Original preview</label></div><div class="canvas-wrap"><img id="canvas" alt="Document composite"></div><footer><span id="dimensions"></span><span>Local processing · MoonBit core</span></footer></section><aside class="properties"><div class="section">PROPERTIES</div><form id="properties"><label>Name<input id="name" required></label><div class="pair"><label>X<input id="x" type="number" min="-1000000" max="1000000" required></label><label>Y<input id="y" type="number" min="-1000000" max="1000000" required></label></div><label>Opacity<input id="opacity" type="range" min="0" max="1" step="0.01"><output id="opacityValue"></output></label><label>Blend mode<select id="op"></select></label><label class="check"><input id="visible" type="checkbox">Visible</label><button class="primary" type="submit">Apply changes</button></form><p id="status" role="status" aria-live="polite"></p></aside></main><script type="module" src="app.js"></script></body></html>

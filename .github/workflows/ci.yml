name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon update
      - run: moon check --target all --deny-warn
      - run: moon test --target all --deny-warn
      - run: moon build --target all --deny-warn
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install Pillow==11.1.0
      - run: python scripts/check_interop.py
      - run: python scripts/build_web.py
      - run: node scripts/check_bridge.mjs
      - run: moon run examples/basic --target native
      - run: moon fmt --check
      - run: moon info && git diff --exit-code

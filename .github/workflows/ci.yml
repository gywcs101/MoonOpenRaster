name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: moonbitlang/setup-moonbit@v1
      - run: moon update
      - run: moon check --target all --deny-warn
      - run: moon test --target all --deny-warn
      - run: moon build --target all --deny-warn
      - run: moon fmt --check
      - run: moon info && git diff --exit-code

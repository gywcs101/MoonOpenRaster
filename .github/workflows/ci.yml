name: CI
on: [push, pull_request]
env:
  PYTHONUTF8: '1'
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon update
      - run: moon check --target all --deny-warn
      - run: moon test --target all --deny-warn
      - run: moon build --target all --deny-warn
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.1.0
      - run: python scripts/check_licenses.py
      - run: python scripts/check_interop.py
      - run: python scripts/check_acceptance.py
      - run: python scripts/check_consistency.py
      - run: python scripts/check_krita.py
      - run: python scripts/check_plus.py
      - run: python scripts/build_web.py
      - run: node scripts/check_bridge.mjs
      - run: node scripts/check_editor.mjs
      - run: node scripts/check_samples.mjs
      - run: python scripts/check_sample_pixels.py
      - run: python scripts/check_artwork.py
      - run: npm ci --prefix tests/browser
      - run: npx --prefix tests/browser playwright install --with-deps chromium
      - run: node tests/browser/check.mjs
      - run: node tests/browser/samples.mjs
      - run: python scripts/check_web_server.py
      - run: python scripts/check_package.py
      - run: python scripts/check_native.py
      - run: moon run examples/basic --target native
      - run: moon run examples/roundtrip --target native
      - run: moon fmt --check
      - run: moon info && git diff --exit-code
  native-platforms:
    name: Native / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Install MoonBit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$HOME/.moon/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install MoonBit (macOS)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon version --all
      - run: moon update
      - run: moon check --target all --deny-warn
      - run: moon test --target native --deny-warn
      - run: moon build --target native --deny-warn
      - run: python scripts/check_native.py
      - run: python scripts/check_package.py --target native
